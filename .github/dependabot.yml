# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Updates are grouped so a week's minor/patch bumps (and, separately, security
# fixes) land as ONE pull request instead of one PR per package. Major bumps
# stay as individual PRs so they get reviewed.

version: 2
updates:
  # JavaScript module (vite build) — /package.json + /package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Jahia JS module API: minor/major must match the javascript-modules
      # engine deployed in Jahia, so upgrade those by hand. Patches are fine.
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Supplied at runtime by the javascript-modules engine (@jahia/vite-plugin
      # marks them external): the bundle never ships them, and the
      # @jahia/javascript-modules-library peer ranges pin their majors. Upgrade
      # by hand, together with the @jahia/* packages, when the engine moves.
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are capped by the i18next/react-i18next peer ranges above.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maven build plugins only (the pom has no parent and no dependencies)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      maven-plugins:
        patterns: ["*"]
        update-types: ["minor", "patch"]
